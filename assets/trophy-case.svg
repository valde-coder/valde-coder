<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" role="img" aria-labelledby="title desc">
  <title id="title">ValdeCoder achievement signals</title>
  <desc id="desc">Five neon achievement cards: first repository, shipped, AI builder, terminal lover, and open source.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b0d16"/><stop offset="1" stop-color="#181329"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  </defs>
  <rect width="1000" height="150" rx="18" fill="url(#bg)" stroke="#34314f" stroke-width="2"/>
  <g font-family="monospace" text-anchor="middle">
    <g transform="translate(18 18)"><rect width="176" height="114" rx="12" fill="#171426" stroke="#634e9e"/><text x="88" y="48" font-size="31">🚀</text><text x="88" y="77" font-size="12" fill="#c4b5fd">FIRST REPO</text><text x="88" y="98" font-size="10" fill="#8b949e">LAUNCHED</text></g>
    <g transform="translate(214 18)"><rect width="176" height="114" rx="12" fill="#171426" stroke="#93652f"/><text x="88" y="48" font-size="31">⚡</text><text x="88" y="77" font-size="12" fill="#fde68a">SHIP IT</text><text x="88" y="98" font-size="10" fill="#8b949e">MAKE IT REAL</text></g>
    <g transform="translate(410 18)"><rect width="176" height="114" rx="12" fill="#171426" stroke="#2d7584"/><text x="88" y="48" font-size="31">🤖</text><text x="88" y="77" font-size="12" fill="#67e8f9">AI BUILDER</text><text x="88" y="98" font-size="10" fill="#8b949e">TEAM MODE</text></g>
    <g transform="translate(606 18)"><rect width="176" height="114" rx="12" fill="#171426" stroke="#9c4773"/><text x="88" y="48" font-size="31">⌘</text><text x="88" y="77" font-size="12" fill="#f9a8d4">TERMINAL</text><text x="88" y="98" font-size="10" fill="#8b949e">POWER USER</text></g>
    <g transform="translate(802 18)"><rect width="176" height="114" rx="12" fill="#171426" stroke="#58864e"/><text x="88" y="48" font-size="31">🌱</text><text x="88" y="77" font-size="12" fill="#bbf7d0">OPEN SOURCE</text><text x="88" y="98" font-size="10" fill="#8b949e">GROWING</text></g>
  </g>
</svg>
